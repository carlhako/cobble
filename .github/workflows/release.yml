name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Build the web interface. This is the ONLY place Node runs; the release
      # artifact contains the compiled bundle, never the frontend source.
      - name: Build frontend
        run: |
          npm --prefix web ci
          npm --prefix web run build
          test -f src/cobble/static/index.html

      # cobble as a pure-python wheel that carries the pre-built static/ bundle
      # (force-include in pyproject.toml). The install script installs this wheel
      # by path and resolves dependencies as pre-built wheels — so the target
      # host needs no build backend and no compiler, only network access.
      - name: Build cobble wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist
          ls dist/cobble-*-py3-none-any.whl

      - name: Assemble release tarball
        run: |
          stage="$(mktemp -d)/cobble"
          mkdir -p "$stage"
          cp -a dist README.md deploy "$stage/"
          # Guard: no frontend source and no compiled-wheel-less python source
          # may ship — the tarball is wheel + docs + deploy assets only.
          if find "$stage" \( -path '*/web/*' -o -name '*.tsx' -o -name 'vite.config.ts' \) -print | grep -q .; then
            echo "frontend source leaked into the tarball" >&2
            exit 1
          fi
          test -f "$stage"/dist/cobble-*-py3-none-any.whl
          # sanity: the wheel actually contains the built interface
          python - "$stage"/dist/cobble-*.whl <<'PY'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          assert "cobble/static/index.html" in names, "wheel is missing the built frontend"
          assert any(n.startswith("cobble/static/assets/") for n in names)
          print("wheel OK:", sys.argv[1])
          PY
          tar -czf cobble.tar.gz -C "$(dirname "$stage")" cobble
          cp deploy/install.sh install.sh

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cobble.tar.gz
            install.sh
          fail_on_unmatched_files: true
